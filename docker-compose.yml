# docker-compose.yml
services:
  server:
    build:
      context: ./sealed-server
    env_file:
      - .env
    extra_hosts:
        - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    restart: unless-stopped

  dashboard:
    build:
      context: ./sealed-dashboard
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
