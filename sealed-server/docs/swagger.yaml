basePath: /api
definitions:
  handlers.AddEnvironmentToProjectPayload:
    properties:
      environment:
        type: string
    type: object
  handlers.AuthResponse:
    properties:
      access_token:
        type: string
      message:
        type: string
      refresh_token:
        type: string
    type: object
  handlers.CreateProjectSecretParams:
    properties:
      environment:
        type: string
      key_name:
        type: string
      rotation_days:
        type: integer
      secret:
        type: string
    type: object
  handlers.DeviceCodeAPIPayload:
    properties:
      device_name:
        type: string
      public_key:
        items:
          type: integer
        type: array
    type: object
  handlers.DeviceCodeAPIResponse:
    properties:
      device_code:
        type: string
      user_code:
        type: string
      verification_url:
        type: string
    type: object
  handlers.InviteProjectMemberPayload:
    properties:
      email:
        type: string
    type: object
  handlers.KeyValuePair:
    properties:
      key:
        type: string
      value:
        type: string
    type: object
  handlers.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.PollingResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.PollingSuccessData'
      status:
        description: authorization_pending | slow_down | access_denied | expired_token
          | done
        type: string
    type: object
  handlers.PollingSuccessData:
    properties:
      device_id:
        type: integer
      email:
        type: string
    type: object
  handlers.RevokeDevicePayload:
    properties:
      device_id:
        type: integer
    type: object
  handlers.UpdateProjectPayload:
    properties:
      name:
        type: string
    type: object
  handlers.UserProfileResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.ValidateAuthenticationPayload:
    properties:
      device_code:
        type: string
      user_code:
        type: string
    type: object
  handlers.ValidateTokenPayload:
    properties:
      device_code:
        type: string
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Timestamptz:
    properties:
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      time:
        type: string
      valid:
        type: boolean
    type: object
  sqlc.CreateProjectParams:
    properties:
      environments:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  sqlc.CreateUserParams:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  sqlc.Device:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      deleted_at:
        type: string
      device_code:
        type: string
      device_name:
        type: string
      ed25519_pubkey:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      revoked_at:
        type: string
      user_id:
        type: integer
    type: object
  sqlc.GetProjectByIDRow:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      environments:
        items:
          type: string
        type: array
      id:
        type: integer
      members: {}
      my_role:
        type: string
      name:
        type: string
      secrets: {}
      slug:
        type: string
    type: object
  sqlc.ListProjectsRow:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      environments:
        items:
          type: string
        type: array
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      slug:
        type: string
    type: object
  utils.EnvelopResponse-array_handlers_KeyValuePair:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.KeyValuePair'
        type: array
    type: object
  utils.EnvelopResponse-array_sqlc_Device:
    properties:
      data:
        items:
          $ref: '#/definitions/sqlc.Device'
        type: array
    type: object
  utils.EnvelopResponse-array_sqlc_ListProjectsRow:
    properties:
      data:
        items:
          $ref: '#/definitions/sqlc.ListProjectsRow'
        type: array
    type: object
  utils.EnvelopResponse-handlers_AuthResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AuthResponse'
    type: object
  utils.EnvelopResponse-handlers_DeviceCodeAPIResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.DeviceCodeAPIResponse'
    type: object
  utils.EnvelopResponse-handlers_PollingResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.PollingResponse'
    type: object
  utils.EnvelopResponse-handlers_UserProfileResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.UserProfileResponse'
    type: object
  utils.EnvelopResponse-sqlc_Device:
    properties:
      data:
        $ref: '#/definitions/sqlc.Device'
    type: object
  utils.EnvelopResponse-sqlc_GetProjectByIDRow:
    properties:
      data:
        $ref: '#/definitions/sqlc.GetProjectByIDRow'
    type: object
  utils.EnvelopResponse-string:
    properties:
      data:
        type: string
    type: object
  utils.ErrResponse:
    properties:
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: souravlayek11@gmail.com
    name: API Support
    url: https://souravlayek.com/contact-me
  description: This is a server to manage Sealed resources.
  termsOfService: http://swagger.io/terms/
  title: Sealed Server API
  version: "1.0"
paths:
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sqlc.CreateUserParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Register user
      tags:
      - auth
  /v1/auth/revalidate-token:
    post:
      consumes:
      - application/json
      description: Generates a new access token using a valid refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Revalidate access token
      tags:
      - auth
  /v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password, returns an access
        token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: User login
      tags:
      - auth
  /v1/auth/user:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /v1/device:
    get:
      consumes:
      - application/json
      description: Get all devices belonging to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-array_sqlc_Device'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Get all devices
      tags:
      - device
  /v1/device/{id}/revoke:
    post:
      consumes:
      - application/json
      description: Revoke a device belonging to the authenticated user.
      parameters:
      - description: Device ID to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RevokeDevicePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-sqlc_Device'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Revoke a device
      tags:
      - device
  /v1/device/code:
    post:
      consumes:
      - application/json
      description: Create device code for login.
      parameters:
      - description: Device key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeviceCodeAPIPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_DeviceCodeAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Create device code
      tags:
      - device
  /v1/device/token:
    post:
      consumes:
      - application/json
      description: Poll for device authorization status using device code.
      parameters:
      - description: Device code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ValidateTokenPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_PollingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Poll for device authorization
      tags:
      - device
  /v1/device/validate:
    post:
      consumes:
      - application/json
      description: Validate user code and register device for authenticated user.
      parameters:
      - description: Device code and user code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ValidateAuthenticationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Validate device authentication
      tags:
      - device
  /v1/projects/:
    get:
      consumes:
      - application/json
      description: Get all projects.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-array_sqlc_ListProjectsRow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project.
      parameters:
      - description: Project details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sqlc.CreateProjectParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /v1/projects/{id}:
    delete:
      consumes:
      - application/json
      description: Delete project.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update project name.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Project name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProjectPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
