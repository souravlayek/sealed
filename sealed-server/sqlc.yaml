version: "2"
sql:
  - schema: "./internal/database/migration/"
    queries: "./internal/database/query/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        out: "./pkg/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.varchar"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - column: "project.environments"
            go_type:
             type: "[]string"
          - column: "secrets.rotation_days"
            go_type:
             type: "int64"
          - column: "device_on_hold.expires_at"
            go_type:
              type: "time.Time"
