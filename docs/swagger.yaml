basePath: /api
definitions:
  handlers.AddEnvironmentToProjectPayload:
    properties:
      environment:
        type: string
    type: object
  handlers.AuthResponse:
    properties:
      access_token:
        type: string
      message:
        type: string
      refresh_token:
        type: string
    type: object
  handlers.CreateProjectSecretParams:
    properties:
      environment:
        type: string
      key_name:
        type: string
      rotation_days:
        type: integer
      secret:
        type: string
    type: object
  handlers.InviteProjectMemberPayload:
    properties:
      email:
        type: string
    type: object
  handlers.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.UserProfileResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Timestamptz:
    properties:
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      time:
        type: string
      valid:
        type: boolean
    type: object
  sqlc.CreateProjectParams:
    properties:
      environments:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  sqlc.CreateUserParams:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  sqlc.GetProjectByIDRow:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      environments:
        items:
          type: string
        type: array
      id:
        type: integer
      members: {}
      my_role:
        type: string
      name:
        type: string
      secrets: {}
    type: object
  sqlc.ListProjectsRow:
    properties:
      created_at:
        $ref: '#/definitions/pgtype.Timestamptz'
      environments:
        items:
          type: string
        type: array
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  utils.EnvelopResponse-array_sqlc_ListProjectsRow:
    properties:
      data:
        items:
          $ref: '#/definitions/sqlc.ListProjectsRow'
        type: array
    type: object
  utils.EnvelopResponse-handlers_AuthResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AuthResponse'
    type: object
  utils.EnvelopResponse-handlers_UserProfileResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.UserProfileResponse'
    type: object
  utils.EnvelopResponse-sqlc_GetProjectByIDRow:
    properties:
      data:
        $ref: '#/definitions/sqlc.GetProjectByIDRow'
    type: object
  utils.EnvelopResponse-string:
    properties:
      data:
        type: string
    type: object
  utils.ErrResponse:
    properties:
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: souravlayek11@gmail.com
    name: API Support
    url: https://souravlayek.com/contact-me
  description: This is a server to manage Sealed resources.
  termsOfService: http://swagger.io/terms/
  title: Sealed Server API
  version: "1.0"
paths:
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sqlc.CreateUserParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: Register user
      tags:
      - auth
  /v1/auth/revalidate-token:
    post:
      consumes:
      - application/json
      description: Generates a new access token using a valid refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Revalidate access token
      tags:
      - auth
  /v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password, returns an access
        token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      summary: User login
      tags:
      - auth
  /v1/auth/user:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /v1/projects/:
    get:
      consumes:
      - application/json
      description: Get all projects.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-array_sqlc_ListProjectsRow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project.
      parameters:
      - description: Project details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/sqlc.CreateProjectParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-handlers_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /v1/projects/{id}:
    delete:
      consumes:
      - application/json
      description: Delete project.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - projects
    get:
      consumes:
      - application/json
      description: Get project with secrets.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-sqlc_GetProjectByIDRow'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Get project details
      tags:
      - projects
  /v1/projects/{id}/environment:
    put:
      consumes:
      - application/json
      description: Add environment to project.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Environemnt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AddEnvironmentToProjectPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Add environment to project
      tags:
      - projects
  /v1/projects/{id}/invite-member:
    post:
      consumes:
      - application/json
      description: Invite a project member
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Environemnt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.InviteProjectMemberPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Invite a new member
      tags:
      - projects
  /v1/projects/{id}/secret:
    post:
      consumes:
      - application/json
      description: Create project secret.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Secret to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateProjectSecretParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Create project secret
      tags:
      - projects
  /v1/projects/{id}/secret/{environment}/{secretKey}:
    delete:
      consumes:
      - application/json
      description: Delete project secret.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Secret ID
        in: path
        name: secretKey
        required: true
        type: string
      - description: Environment
        in: path
        name: environment
        required: true
        type: string
      - description: Secret to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateProjectSecretParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.EnvelopResponse-string'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrResponse'
      security:
      - BearerAuth: []
      summary: Delete project secret
      tags:
      - projects
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
