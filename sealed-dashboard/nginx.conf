# sealed-dashboard/nginx.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # TanStack Router handles routes client-side, so unknown paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
